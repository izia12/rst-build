  <text x="600" y="675" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E40AF">
    🛠️ ТЕХНОЛОГИИ: React + Redux + WebAssembly + Rust + Excel Libraries
  </text>
